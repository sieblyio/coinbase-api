        maximum_total:
          description: Maximum USD the user will pay after slippage. Populated for
            BUY orders with base_size.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.Amount'
        maximum_contracts:
          type: string
          description: Maximum contracts the user will sell after slippage. Populated
            for SELL orders with quote_size.
      title: Prediction market-specific metadata for the order preview response
    coinbase.public_api.authed.retail_brokerage_api.PredictionRequestMetadata:
