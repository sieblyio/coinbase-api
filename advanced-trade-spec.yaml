    coinbase.public_api.authed.retail_brokerage_api.EquityTradingFlags:
      type: object
      properties:
        tradable:
          type: boolean
          description: Whether at least one buy or sell flow is enabled for this product.
        searchable:
          type: boolean
          description: Whether the product is searchable and discoverable.
        buy_enabled:
          type: boolean
          description: Whether any buy order flow is enabled.
        buy_whole_shares:
          type: boolean
          description: Whether buying a whole number of shares is enabled.
        buy_fractional_shares:
          type: boolean
          description: Whether buying a fractional number of shares is enabled.
        buy_notional:
          type: boolean
          description: Whether buying by quote-currency amount is enabled.
        sell_enabled:
          type: boolean
          description: Whether any sell order flow is enabled.
        sell_whole_shares:
          type: boolean
          description: Whether selling a whole number of shares is enabled.
        sell_fractional_shares:
          type: boolean
          description: Whether selling a fractional number of shares is enabled.
        sell_notional:
          type: boolean
          description: Whether selling by quote-currency amount is enabled.
      title: EquityTradingFlags contains granular trading permissions for equity products
    coinbase.public_api.authed.retail_brokerage_api.EquityTradingSession:
      type: string
      enum:
      - UNKNOWN_EQUITY_TRADING_SESSION
      - EQUITY_TRADING_SESSION_NORMAL
      - EQUITY_TRADING_SESSION_AFTER_HOURS
      - EQUITY_TRADING_SESSION_MULTI_SESSION
      - EQUITY_TRADING_SESSION_OVERNIGHT
      - EQUITY_TRADING_SESSION_PRE_MARKET
      default: UNKNOWN_EQUITY_TRADING_SESSION
      description: Equity execution session. NORMAL is regular market hours and is
        the only session that supports market orders. PRE_MARKET, AFTER_HOURS, OVERNIGHT,
        and MULTI_SESSION accept only whole-share limit orders. MULTI_SESSION spans
        multiple eligible sessions.
      title: Trading session in which an equity order may execute.
    coinbase.public_api.authed.retail_brokerage_api.EquityTradingSessionWindow:
      type: object
      properties:
        session_type:
          description: Trading session represented by this window.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.EquityTradingSession'
        session_start_time:
          type: string
          format: RFC3339 Timestamp
          description: Start of the session window.
        session_end_time:
          type: string
          format: RFC3339 Timestamp
          description: End of the session window.
        support_fractional:
          type: boolean
          description: Whether fractional-share orders are supported during this session.
        limit_only:
          type: boolean
          description: Whether only limit orders are supported during this session.
      title: TradingWindow represents a trading session window within a trading day
    coinbase.public_api.authed.retail_brokerage_api.FcmScheduledMaintenance:
      type: object
      properties:
        start_time:
          type: string
          format: RFC3339 Timestamp
        end_time:
