    coinbase.public_api.authed.retail_brokerage_api.NewOrderRequest:
      type: object
      properties:
        client_order_id:
          type: string
          example: 0000-00000-000000
          description: A unique ID provided for the order (used for identification
            purposes). If the ID provided is not unique, the order will not be created
            and the order corresponding with that ID will be returned instead.
          required:
          - client_order_id
        product_id:
          type: string
          example: BTC-USD
          description: Canonical product identifier for the order. For equities, use
            the product_id returned by the Products API, not the display ticker.
          required:
          - product_id
        side:
          description: The side of the market that the order is on (e.g. 'BUY', 'SELL').
          required:
          - side
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.OrderSide'
        order_configuration:
          description: The configuration of the order (e.g. the order type, size,
            etc).
          required:
          - order_configuration
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.OrderConfiguration'
        leverage:
          type: string
          example: '2.0'
          description: The amount of leverage for the order (default is 1.0).
        margin_type:
          description: Margin Type for this order (default is CROSS).
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.MarginType'
        retail_portfolio_id:
          type: string
          example: 11111111-1111-1111-1111-111111111111
          description: '**(Deprecated)** The ID of the portfolio to associate the
            order with. Only applicable for legacy keys. CDP keys will default to
            the key''s permissioned portfolio.'
        preview_id:
          type: string
          example: b40bbff9-17ce-4726-8b64-9de7ae57ad26
          description: Preview ID for this order, to associate this order with a preview
            request
        attached_order_configuration:
          description: The configuration of the attached order. Only TriggerBracketGtc
            is eligible. Size field must be omitted as the size of the attached order
            is the same as that of the parent order.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.OrderConfiguration'
        sor_preference:
          example: SOR_ENABLED
          description: Smart Order Routing preference for this order. UNSPECIFIED
            uses default behavior based on user settings.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.SorPreference'
        prediction_metadata:
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.PredictionRequestMetadata'
        equity_order_metadata:
          description: Equity-specific order instructions. For equity products, use
            this field to select the trading session and time in force.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.EquityOrderMetadata'
        cost_basis_method:
          description: The cost basis method for the order
          allOf:
          - $ref: '#/components/schemas/coinbase.positions.CostBasisMethod'
      required:
      - client_order_id
      - product_id
      - side
      - order_configuration
