    coinbase.payments.common.payment_methods.FedwireInstitution:
      type: object
      properties:
        name:
          type: string
          title: 'AIDoc: The name of the financial institution (must be present)'
        address:
          title: 'AIDoc: The address of the financial institution (must be present
            for Fedwire payments)'
          allOf:
          - $ref: '#/components/schemas/coinbase.payments.common.payment_methods.FedwireAddress'
        identifier:
          type: string
          title: 'Required field that will be populated with a value according to
            the identifier_code.

            1. When identifier_code is ''F'', this field represents a 9 digit ABA
            code and is likely to match

            the value of the `routing_number` field.

            Ex: "026009593"

            2. When identifier_code is ''B'', this field represents an 8-11 character
            SWIFT code, it *should* identify the same bank as the ABA code in

            `routing_number`. Some implementations (Crossriver) provide the Swift
            here instead

            Ex: "BOFAUS3N"

            3. When identifier_code is ''D'', this field represents an account number.
            This usually means it is a "For Further Credit" (FFC) to the

            account number and there is an intermediary bank involved.

            Ex: "000004121345797"'
        type:
          title: 'AIDoc: The type of institution identifier'
          allOf:
          - $ref: '#/components/schemas/coinbase.payments.common.payment_methods.FedwireInstitution.Type'
