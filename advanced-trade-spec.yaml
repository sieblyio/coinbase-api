        after_hours_order_entry_disabled:
          type: boolean
        closed_reason:
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.FcmTradingSessionClosedReason'
        maintenance:
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.FcmScheduledMaintenance'
    coinbase.public_api.authed.retail_brokerage_api.FcmTradingSessionState:
      type: string
      enum:
      - FCM_TRADING_SESSION_STATE_UNDEFINED
      - FCM_TRADING_SESSION_STATE_PRE_OPEN
      - FCM_TRADING_SESSION_STATE_PRE_OPEN_NO_CANCEL
      - FCM_TRADING_SESSION_STATE_OPEN
      - FCM_TRADING_SESSION_STATE_CLOSE
      - FCM_TRADING_SESSION_STATE_HALTED
      default: FCM_TRADING_SESSION_STATE_UNDEFINED
      description: Defines the state of a trading session.
    coinbase.public_api.authed.retail_brokerage_api.FeeTier:
      type: object
      properties:
        pricing_tier:
          type: string
          example: <$10k
          description: Pricing tier for user, determined by notional (USD) volume.
        taker_fee_rate:
          type: string
          example: '0.0010'
          description: Taker fee rate, applied if the order takes liquidity.
        maker_fee_rate:
          type: string
          example: '0.0020'
          description: Maker fee rate, applied if the order creates liquidity.
        aop_from:
          type: string
          example: '0'
          description: Lower bound (inclusive) of pricing tier in usd of total assets
            on platform.
        aop_to:
          type: string
          example: '10000'
          description: Upper bound (exclusive) of pricing tier in usd of total assets
            on platform.
        volume_types_and_range:
          type: array
          example:
          - volume_types:
            - VOLUME_TYPE_SPOT
            - VOLUME_TYPE_US_DERIVATIVES
            vol_from: '0'
            vol_to: '50000'
          items:
            $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.VolumeTypesAndRange'
          description: List of rules that define how a tier evaluates 30-day volume
            by combining specific volume types.
    coinbase.public_api.authed.retail_brokerage_api.FeeTierQualificationType:
      type: string
      enum:
      - FEE_TIER_QUALIFICATION_TYPE_UNKNOWN
      - FEE_TIER_QUALIFICATION_TYPE_SPOT_VOLUME
      - FEE_TIER_QUALIFICATION_TYPE_US_DERIVATIVES_VOLUME
      - FEE_TIER_QUALIFICATION_TYPE_INTX_PERPS_VOLUME
      - FEE_TIER_QUALIFICATION_TYPE_AOP
      - FEE_TIER_QUALIFICATION_TYPE_COMBINED_VOLUME
      default: FEE_TIER_QUALIFICATION_TYPE_UNKNOWN
      description: "FeeTierQualificationType identifies which dimension placed the\
        \ user in their fee tier\nwhen promotional fees/incentives are excluded.\n\
        \n - FEE_TIER_QUALIFICATION_TYPE_COMBINED_VOLUME: COMBINED_VOLUME indicates\
        \ the tier is qualified by a sum of multiple volume types\n(see volume_types\
        \ on the corresponding fee tier for details)."
    coinbase.public_api.authed.retail_brokerage_api.FeeTierWithoutPromotion:
      type: object
      properties:
        pricing_tier:
          type: string
          example: Advanced 3
          description: '**(Deprecated)** Pricing tier name; prefer `current_tier.pricing_tier`.'
        qualification_type:
          description: Dimension that qualifies the user for this tier (spot volume,
            AOP, etc.).
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.FeeTierQualificationType'
        current_value:
          type: string
          example: '25000'
          description: The user's current value for the qualifying dimension (volume
            in USD, or AOP in USD).
        next_tier_threshold:
          type: string
          example: '50000'
          description: The value of the qualifying dimension needed to reach the next
            tier. Empty if the user is already in the top tier.
        current_tier:
          description: Full fee schedule definition for the user's current non-promotional
            tier (maker/taker rates and tier bounds).
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.FeeTier'
        next_tier:
          description: Full fee schedule definition for the next non-promotional tier.
            Omitted when the user is already in the top tier.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.FeeTier'
        current_tier_threshold:
          type: string
          example: '10000'
          description: The lower bound of the qualifying dimension for the user's
            current tier (volume in USD, or AOP in USD). Empty if undetermined.
      description: 'FeeTierWithoutPromotion describes the fee tier a user is in based
        purely on volume or AOP,

        excluding any promotional fee schedules or fee incentives.'
    coinbase.public_api.authed.retail_brokerage_api.Fill:
      type: object
      properties:
        entry_id:
          type: string
          example: 22222-2222222-22222222
          description: Unique identifier for the fill.
        trade_id:
          type: string
          example: 1111-11111-111111
          description: ID of the fill -- unique for all `FILL` trade_types but not
            unique for adjusted fills.
        order_id:
          type: string
          example: 0000-000000-000000
          description: The ID of the order.
        trade_time:
          type: string
          format: RFC3339 Timestamp
          example: '2021-05-31T09:59:59Z'
          description: Time at which this fill was completed.
        trade_type:
          type: string
          example: FILL
          description: String denoting what type of fill this is. Regular fills have
            the value `FILL`. Adjusted fills have possible values `REVERSAL`, `CORRECTION`,
            `SYNTHETIC`.
        price:
          type: string
          example: '10000.00'
          description: Price the fill was posted at.
        size:
          type: string
          example: '0.001'
          description: Amount of order that was transacted at this fill.
        commission:
          type: string
          example: '1.25'
          description: Fee amount for fill.
        product_id:
          type: string
          example: BTC-USD
          description: Canonical product identifier for the fill. For equities, use
            the product_id returned by the Products API, not the display ticker.
        sequence_timestamp:
          type: string
          format: RFC3339 Timestamp
          example: '2021-05-31T09:58:59Z'
          description: Time at which this fill was posted.
        liquidity_indicator:
          description: Whether this fill gives or takes liquidity.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.LiquidityIndicator'
        size_in_quote:
          type: boolean
          example: false
          description: Whether the order was placed with quote currency.
        user_id:
          type: string
          example: 3333-333333-3333333
          description: User that placed the order the fill belongs to.
        side:
          description: Side of order that this fill belongs to.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.OrderSide'
        retail_portfolio_id:
          type: string
          example: 4444-444444-4444444
          description: Portfolio that the order fill belongs to.
        fillSource:
          description: Field denoting what type of fill source was used for this fill.
          title: Represents a fill source type used
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.FillSource'
        commission_detail_total:
          description: Breakdown of commission charges for the fill
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.CommissionDetailTotal'
        order_data_source:
          description: The backend system from which this fill was retrieved.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.OrderDataSource'
        future_legs:
          type: array
          items:
            $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.FillFutureLeg'
          description: Individual legs of a futures combo fill. Empty for non-combo
            fills.
      title: Represents a fill for an order in the system
    coinbase.public_api.authed.retail_brokerage_api.FillFutureLeg:
      type: object
      properties:
        product_id:
          type: string
          description: Futures product identifier for this leg.
        combo_id:
          type: string
          description: Identifier shared by all legs of the same combo fill.
        trade_id:
          type: string
          description: Trade identifier for this leg's fill.
        filled_price:
          type: string
          description: Filled price for this leg.
        filled_size:
          type: string
          description: Filled quantity for this leg.
        side:
          description: BUY/SELL direction of this leg.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.OrderSide'
      description: FillFutureLeg represents an individual leg of a futures combo fill.
    coinbase.public_api.authed.retail_brokerage_api.FillSource:
      type: string
      enum:
      - FILL_SOURCE_UNKNOWN
      - FILL_SOURCE_CLOB
      - FILL_SOURCE_RFQ
