    coinbase.public_api.authed.retail_brokerage_api.PredictionOrderMetadata:
      type: object
      properties:
        contract_subtotal:
          type: string
          description: The base contract value from user's perspective, adjusted for
            prediction market direction.
        user_net_total:
          type: string
          description: The net amount user pays (for buys) or receives (for sells),
            accounting for prediction market direction and fees.
        slippage_percentage:
          type: string
          description: Slippage tolerance percentage based on price tier.
        minimum_contracts:
          type: string
          description: Minimum contracts the user will receive after slippage. Populated
            for BUY orders with quote_size.
        minimum_total:
          description: Minimum USD the user will receive after slippage. Populated
            for SELL orders with base_size.
