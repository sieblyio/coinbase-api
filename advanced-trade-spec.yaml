          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      parameters:
      - name: order_ids
        description: The ID(s) of order(s).
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: trade_ids
        description: The ID(s) of the trades of fills.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: product_ids
        description: Canonical product ID(s) to filter fills by. For equities, use
          product_id rather than the display ticker.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: start_sequence_timestamp
        description: Only fills with a trade time after the specified start date are
          returned.
        in: query
        required: false
        schema:
          type: string
          format: RFC3339 Timestamp
      - name: end_sequence_timestamp
        description: Only fills with a trade time before the specified end date are
          returned.
        in: query
        required: false
        schema:
          type: string
          format: RFC3339 Timestamp
      - name: retail_portfolio_id
        description: '**(Deprecated)** Only fills matching this retail portfolio id
          are returned. Only applicable for legacy keys. CDP keys will default to
          the key''s permissioned portfolio.'
        in: query
        required: false
        schema:
          type: string
      - name: limit
        description: The number of fills to be returned (default is 100).
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        description: For paginated responses, returns all responses that come after
          this value.
        in: query
        required: false
        schema:
          type: string
      - name: sort_by
        description: Sort results by a field, results use unstable pagination. Default
          is sort by creation time
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_SORT_BY
          - PRICE
          - TRADE_TIME
          default: UNKNOWN_SORT_BY
      - name: asset_filters
        description: Only returns the fills where the quote, base or underlying asset
          matches the provided asset filter(s) (e.g. 'BTC').
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: order_types
        description: "Only returns fills for orders matching the specified order types\
          \ (e.g. 'MARKET', 'LIMIT').\n\n - MARKET: A [market order](https://en.wikipedia.org/wiki/Order_(exchange)#Market_order)\n\
          \ - LIMIT: A [limit order](https://en.wikipedia.org/wiki/Order_(exchange)#Limit_order)\n\
          \ - STOP: A stop order is an order that becomes a market order when triggered\n\
          \ - STOP_LIMIT: A stop order is a limit order that doesn't go on the book\
          \ until it hits the stop price\n - BRACKET: A bracket order is a way to\
          \ mitigate potential losses in volatile markets, consisting of a limit price\
          \ leg and a stop trigger price.\n - TWAP: TWAP order is a way to split large\
          \ buy/sell orders to smaller chunks to reduce market impact\n - ROLL_OPEN:\
          \ ROLL_OPEN order is the open step order of a contract roll\n - ROLL_CLOSE:\
          \ ROLL_CLOSE is the close step order in a contract roll\n - LIQUIDATION:\
          \ LIQUIDATION is a special order type that is used to liquidate a position\n\
          \ - SCALED: SCALED order is an order that is split into multiple child orders\
          \ at incrementally increasing or decreasing prices"
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - UNKNOWN_ORDER_TYPE
            - MARKET
            - LIMIT
            - STOP
            - STOP_LIMIT
            - BRACKET
            - TWAP
            - ROLL_OPEN
            - ROLL_CLOSE
            - LIQUIDATION
            - SCALED
      - name: order_side
        description: Only returns fills for orders matching the specified side ('BUY'
          or 'SELL'). By default, returns all sides.
        in: query
        required: false
        schema:
          type: string
          enum:
          - BUY
          - SELL
          default: ''
      - name: product_types
        description: Only returns fills for orders matching the specified product
          types (for example, SPOT, FUTURE, or EQUITY). By default, returns all product
          types.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - UNKNOWN_PRODUCT_TYPE
            - SPOT
            - FUTURE
            - EQUITY
            - OPTION_GROUP
            - FUTURE_GROUP
      - name: proof_token
        description: Optional proof token for 2FA validation when accessing transaction
          history (EU SCA compliance).
        in: query
        required: false
        schema:
          type: string
      tags:
      - Orders
