    coinbase.payments.shared.Money:
      type: object
      properties:
        amount:
          type: string
          description: 'The quantity in string.


            For fiat, its unit is the corresponding fractional currency unit. For
            example, "1" means 1 JPY or 0.01 USD when

            currency is JPY or USD respectively. The source of truth for ratio to
            main unit is in http://go/money-fractional.


            Stored as a string because some cryptocurrencies, namely ETH supports
            up to 19 digits of precision which would

            exceed the capacity of storing the value as an int64.'
        currency:
          type: string
          description: 'Currency in 3-letter ISO4217 code.


            For example, USD, GBP or EUR or in the case of cryptocurrencies its 3-letter
            ticker BTC, ETH, XLM etc.


            As of 2019-09-16 there are _no_ clashes between ISO4217 and crypto currency
            abbreviations.'
      description: 'A quantity of money.


        Note that a few places refer to this file for documentation using Github URL.
        Please search and modify those URLs if

        this file is moved.'
