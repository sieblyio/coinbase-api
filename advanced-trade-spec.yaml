      description: A bearer token signed using your API Key Secret, see
        [Creating API Keys](/coinbase-app/authentication-authorization/api-key-authentication)
        section of our docs for more information. See
        [Scope & Permissions](/coinbase-app/advanced-trade-apis/rest-scopes)
        for the permission each endpoint requires.
    OAuth2:
      type: oauth2
      description: An OAuth 2.0 access token from the Coinbase App OAuth2 flow. See
        [Scope & Permissions](/coinbase-app/advanced-trade-apis/rest-scopes) for the scope
        each endpoint requires.
