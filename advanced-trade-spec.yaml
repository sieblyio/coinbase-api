          description: True if the order is fully filled, false otherwise.
        product_type:
          description: The type of order, i.e. Spot or Future
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.ProductType'
        reject_message:
          type: string
          description: Message stating why the order was rejected.
        cancel_message:
          type: string
          description: Message stating why the order was canceled.
        order_placement_source:
          description: Message stating which source an order was placed from.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.OrderPlacementSource'
        outstanding_hold_amount:
          type: string
          description: The remaining hold amount (holdAmount - holdAmountReleased).
            [value is 0 if holdReleased is true]
        is_liquidation:
          type: boolean
          description: True if order is of liquidation type.
        last_fill_time:
          type: string
          format: RFC3339 Timestamp
          description: Time of the most recent fill for this order
        edit_history:
          type: array
          items:
            $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.Edit'
          description: An array of the latest 5 edits per order
        leverage:
          type: string
          description: The amount of leverage for the order (default is 1.0).
        margin_type:
          description: Margin Type for this order (default is CROSS).
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.MarginType'
        retail_portfolio_id:
          type: string
          example: b87a2d3f-8a1e-49b3-a4ea-402d8c389aca
          description: The ID of the portfolio this order is associated with.
        originating_order_id:
          type: string
          example: b87a2d3f-8a1e-49b3-a4ea-402d8c389aca
          description: The ID of the parent order of an attached order.
        attached_order_id:
          type: string
          example: b87a2d3f-8a1e-49b3-a4ea-402d8c389aca
          description: The ID of the attached order of a parent order.
        attached_order_configuration:
          description: The configuration of the attached order. Only TriggerBracketGtc
            is eligible. Size field must be omitted as the size of the attached order
            is the same as that of the originating or parent order.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.OrderConfiguration'
        current_pending_replace:
          description: Price/Size of the current edit
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.Edit'
        commission_detail_total:
          description: Breakdown of commission charges for the order
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.CommissionDetailTotal'
        workable_size:
          type: string
          example: '3'
          description: The size of order in the originating order which is filled.
        workable_size_completion_pct:
          type: string
          example: '50'
          description: Percentage of the originating order which is filled
        product_details:
          description: Product-specific details, the oneof corresponds to the ProductType
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.ProductDetails'
        cost_basis_method:
          description: The cost basis method for the order
          allOf:
          - $ref: '#/components/schemas/coinbase.positions.CostBasisMethod'
        displayed_order_config:
          description: Displayed order configuration. For equity orders, MARKET_GFD
            is used for market orders and LIMIT_GFD/LIMIT_GTC for limit orders.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.DisplayedOrderConfig'
        equity_trading_session:
          description: Trading session in which an equity order is eligible to execute.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.EquityTradingSession'
        prediction_side:
          description: Direction of the prediction market order (YES or NO)
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.PredictionSide'
        last_update_time:
          type: string
          format: RFC3339 Timestamp
          description: Time of the latest update to this order. It is defined as the
            time of the most recent fill if the order has any fills. Else this timestamp
            will be the order creation time.
        total_value_after_fees_native:
          description: Total value after fees, converted to the user's native currency.
            Empty when rates are unavailable.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.Amount'
        outstanding_hold_amount_native:
          description: Outstanding hold amount, converted to the user's native currency
            (source currency is quote for BUY, base for SELL). Empty when rates are
            unavailable.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.Amount'
        total_fees_native:
          description: Total fees, converted to the user's native currency. Empty
            when rates are unavailable.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.Amount'
      required:
      - order_id
      - product_id
      - side
      - created_time
      - status
      - user_id
      - order_configuration
      - client_order_id
      - completion_percentage
      - average_filled_price
      - number_of_fills
      - pending_cancel
      - size_in_quote
      - total_fees
      - size_inclusive_of_fees
      - total_value_after_fees
    coinbase.public_api.authed.retail_brokerage_api.OrderConfiguration:
      type: object
      properties:
        market_market_ioc:
          description: 'Buy or sell a specified quantity of an Asset at the current
            best available market price. [Read more on Market Orders](https://help.coinbase.com/en/coinbase/trading-and-funding/advanced-trade/order-types#market-order) '
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.MarketMarketIoc'
        market_market_fok:
          description: Buy or sell a specified quantity of an Asset at the current
            best available market price. The Order will only post to the Order Book
            if it is to immediately and completely Fill. [Read more on Market Orders](https://help.coinbase.com/en/coinbase/trading-and-funding/advanced-trade/order-types#market-order)
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.MarketMarketFok'
        sor_limit_ioc:
          description: Buy or sell a specified quantity of an Asset at a specified
            price. The Order will only post to the Order Book if it will immediately
            Fill; any remaining quantity is canceled. [Read more on Limit Orders.](https://help.coinbase.com/en/coinbase/trading-and-funding/advanced-trade/order-types#limit-order)
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.SorLimitIoc'
        limit_limit_gtc:
          description: Buy or sell a specified quantity of an Asset at a specified
            price. If posted, the Order will remain on the Order Book until canceled.
            [Read more on Limit Orders.](https://help.coinbase.com/en/coinbase/trading-and-funding/advanced-trade/order-types#limit-order)
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.LimitLimitGtc'
        limit_limit_gtd:
          description: Buy or sell a specified quantity of an Asset at a specified
            price. If posted, the Order will remain on the Order Book until a certain
            time is reached or the Order is canceled. [Read more on Limit Orders.](https://help.coinbase.com/en/coinbase/trading-and-funding/advanced-trade/order-types#limit-order)
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.LimitLimitGtd'
        limit_limit_fok:
          description: Buy or sell a specified quantity of an Asset at a specified
            price. The Order will only post to the Order Book if it is to immediately
            and completely Fill. [Read more on Limit Orders.](https://help.coinbase.com/en/coinbase/trading-and-funding/advanced-trade/order-types#limit-order)
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.LimitLimitFok'
        twap_limit_gtd:
          description: A time-weighted average price (TWAP) order type that calculates
            the average price of a product to programmatically execute an order over
            a specified duration.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.TwapLimitGtd'
        stop_limit_stop_limit_gtc:
          description: Posts an Order to buy or sell a specified quantity of an Asset,
            but only if and when the last trade price on the Order Book equals or
            surpasses the Stop Price. If posted, the Order will remain on the Order
            Book until canceled. [Read more on Stop-Limit Orders.](https://help.coinbase.com/en/coinbase/trading-and-funding/advanced-trade/order-types#stop-limit-order)
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.StopLimitStopLimitGtc'
        stop_limit_stop_limit_gtd:
          description: Posts an Order to buy or sell a specified quantity of an Asset,
            but only if and when the last trade price on the Order Book equals or
            surpasses the Stop Price. If posted, the Order will remain on the Order
            Book until a certain time is reached or the Order.  [Read more on Stop-Limit
            Orders.](https://help.coinbase.com/en/coinbase/trading-and-funding/advanced-trade/order-types#stop-limit-order)
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.StopLimitStopLimitGtd'
        trigger_bracket_gtc:
          description: A Limit Order to buy or sell a specified quantity of an Asset
            at a specified price, with stop limit order parameters embedded in the
            order. If posted, the Order will remain on the Order Book until canceled.
            [Read more on Bracket Orders.](https://help.coinbase.com/en/coinbase/trading-and-funding/advanced-trade/order-types#bracket-order)
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.TriggerBracketGtc'
        trigger_bracket_gtd:
          description: A Limit Order to buy or sell a specified quantity of an Asset
            at a specified price, with stop limit order parameters embedded in the
            order. If posted, the Order will remain on the Order Book until a certain
            time is reached or the Order is canceled. [Read more on Bracket Orders.](https://help.coinbase.com/en/coinbase/trading-and-funding/advanced-trade/order-types#bracket-order)
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.TriggerBracketGtd'
        scaled_limit_gtc:
          description: A scaled order enables users to divide a large order into multiple
            smaller limit orders, which are placed incrementally across a user-defined
            price range. [Read more on Limit Orders.](https://help.coinbase.com/en/coinbase/trading-and-funding/advanced-trade/order-types#limit-order)
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.ScaledLimitGtc'
    coinbase.public_api.authed.retail_brokerage_api.OrderDataSource:
      type: string
      enum:
      - ORDER_DATA_SOURCE_UNKNOWN
      - ORDER_DATA_SOURCE_TRADING_PROXY
      - ORDER_DATA_SOURCE_ACCOUNT_HISTORY_SERVICE
      default: ORDER_DATA_SOURCE_UNKNOWN
      description: OrderDataSource identifies which backend system served the order.
    coinbase.public_api.authed.retail_brokerage_api.OrderExecutionStatus:
      type: string
      enum:
      - PENDING
      - OPEN
      - FILLED
      - CANCELLED
      - EXPIRED
      - FAILED
      - UNKNOWN_ORDER_STATUS
      - QUEUED
      - CANCEL_QUEUED
      - EDIT_QUEUED
      default: PENDING
    coinbase.public_api.authed.retail_brokerage_api.OrderPlacementSource:
      type: string
      enum:
      - UNKNOWN_PLACEMENT_SOURCE
      - RETAIL_SIMPLE
      - RETAIL_ADVANCED
      - RETAIL_ADMIN
      - RETAIL_RAISE
      default: UNKNOWN_PLACEMENT_SOURCE
      title: OrderPlacementSource reflects which source an order was placed from
    coinbase.public_api.authed.retail_brokerage_api.OrderPreviewRequest:
      type: object
      properties:
        product_id:
          type: string
          description: The trading pair (e.g. 'BTC-USD').
          required:
          - product_id
        side:
          description: The side of the market that the order is on (e.g. 'BUY', 'SELL').
          required:
          - side
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.OrderSide'
        order_configuration:
          description: The configuration of the order (e.g. the order type, size,
            etc).
          required:
          - order_configuration
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.OrderConfiguration'
        leverage:
          type: string
          example: '2.0'
          description: The amount of leverage for the order (default is 1.0).
        margin_type:
          description: Margin Type for this order (default is CROSS).
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.MarginType'
        retail_portfolio_id:
          type: string
          example: 11111111-1111-1111-1111-111111111111
          description: '**(Deprecated)** The ID of the portfolio to associate the
            order with. Only applicable for legacy keys. CDP keys will default to
            the key''s permissioned portfolio.'
        attached_order_configuration:
          description: The configuration of the attached order. Only TriggerBracketGtc
            is eligible. Size field must be omitted as the size of the attached order
            is the same as that of the parent order.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.OrderConfiguration'
        equity_order_metadata:
          description: Equity-specific metadata for the order.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.EquityOrderMetadata'
        prediction_metadata:
          description: Request metadata specific to prediction market orders (YES/NO).
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.PredictionRequestMetadata'
        cost_basis_method:
          description: The method used to calculate the cost basis for the order.
          allOf:
          - $ref: '#/components/schemas/coinbase.positions.CostBasisMethod'
      title: OrderPreview
      required:
      - product_id
      - side
      - commission_rate
      - order_configuration
    coinbase.public_api.authed.retail_brokerage_api.OrderPreviewResponse:
      type: object
      properties:
        order_total:
          type: string
          required:
          - order_total
        commission_total:
          type: string
          description: Currency amount of the applied commission (so not the rate
            that was used on input)
          required:
          - commission_total
        errs:
          type: array
          items:
            $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.PreviewFailureReason'
          description: List of potential failure reasons were this order to be submitted
          required:
          - errs
        warning:
          type: array
          items:
            $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.PreviewWarningMsg'
          required:
          - warning
        quote_size:
          type: string
          example: 10
          description: The amount of the second Asset in the Trading Pair. For example,
            on the BTC/USD Order Book, USD is the Quote Asset.
          required:
          - quote_size
        base_size:
          type: string
          example: 0.001
          description: The amount of the first Asset in the Trading Pair. For example,
            on the BTC-USD Order Book, BTC is the Base Asset.
          required:
          - base_size
        best_bid:
          type: string
          required:
          - best_bid
        best_ask:
          type: string
          required:
          - best_ask
        is_max:
          type: boolean
          description: Indicates whether tradable_balance should be set to the maximum
            amount.
          required:
          - is_max
        order_margin_total:
          type: string
        leverage:
          type: string
          example: '2.0'
          description: The amount of leverage for the order (default is 1.0).
        long_leverage:
          type: string
        short_leverage:
          type: string
        slippage:
          type: string
        preview_id:
          type: string
        current_liquidation_buffer:
          type: string
        projected_liquidation_buffer:
          type: string
        max_leverage:
          type: string
        pnl_configuration:
          description: Expected PNL of an order. This value is an estimate and does
            not take into account fees and slippage.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.PnlConfiguration'
        twap_bucket_metadata:
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.TwapBucketMetadata'
        position_notional_limit:
          type: string
        max_notional_at_requested_leverage:
          type: string
        margin_ratio_data:
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.MarginRatioData'
        commission_detail_total:
          description: Breakdown of commission charges for the order
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.CommissionDetailTotal'
        scaled_metadata:
          description: Metadata for scaled orders containing the order distribution
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.ScaledOrderMetadata'
        compliance_limit_data:
          description: Optional compliance limit data
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.ComplianceLimitData'
        est_average_filled_price:
          type: string
          description: Estimated fill price for order.
        prediction_order_metadata:
          description: Metadata specific to prediction market orders.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.PredictionOrderMetadata'
        predicted_liquidation_price:
          type: string
          description: Predicted liquidation price for FCM orders.
        available_buying_power:
          type: string
          description: Available buying power for futures trading. Used to calculate
            funding shortfall when order fails due to insufficient funds.
        max_loss:
          type: string
          example: '10.00'
          description: Maximum potential loss for the order. For equity option buy
            orders this equals order_total.
      required:
      - order_total
      - commission_total
      - errs
      - warning
      - quote_size
      - base_size
      - best_bid
      - best_ask
      - is_max
    coinbase.public_api.authed.retail_brokerage_api.OrderSide:
      type: string
      enum:
      - BUY
      - SELL
      default: ''
    coinbase.public_api.authed.retail_brokerage_api.OrderType:
      type: string
      enum:
      - UNKNOWN_ORDER_TYPE
      - MARKET
      - LIMIT
      - STOP
      - STOP_LIMIT
      - BRACKET
      - TWAP
      - ROLL_OPEN
      - ROLL_CLOSE
      - LIQUIDATION
      - SCALED
      default: UNKNOWN_ORDER_TYPE
      title: "- MARKET: A [market order](https://en.wikipedia.org/wiki/Order_(exchange)#Market_order)\n\
        \ - LIMIT: A [limit order](https://en.wikipedia.org/wiki/Order_(exchange)#Limit_order)\n\
        \ - STOP: A stop order is an order that becomes a market order when triggered\n\
        \ - STOP_LIMIT: A stop order is a limit order that doesn't go on the book\
        \ until it hits the stop price\n - BRACKET: A bracket order is a way to mitigate\
        \ potential losses in volatile markets, consisting of a limit price leg and\
        \ a stop trigger price.\n - TWAP: TWAP order is a way to split large buy/sell\
        \ orders to smaller chunks to reduce market impact\n - ROLL_OPEN: ROLL_OPEN\
        \ order is the open step order of a contract roll\n - ROLL_CLOSE: ROLL_CLOSE\
        \ is the close step order in a contract roll\n - LIQUIDATION: LIQUIDATION\
        \ is a special order type that is used to liquidate a position\n - SCALED:\
        \ SCALED order is an order that is split into multiple child orders at incrementally\
        \ increasing or decreasing prices"
    coinbase.public_api.authed.retail_brokerage_api.PaginationMetadata:
      type: object
      properties:
        prev_cursor:
          type: string
        next_cursor:
