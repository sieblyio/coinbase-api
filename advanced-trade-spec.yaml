          type: string
          format: RFC3339 Timestamp
      required:
      - product_id
      - bids
      - asks
    coinbase.public_api.authed.retail_brokerage_api.Product:
      type: object
      properties:
        product_id:
          type: string
          example: BTC-USD
          description: The trading pair (e.g. 'BTC-USD').
          required:
          - product_id
        price:
          type: string
          example: '140.21'
          description: The current price for the product, in quote currency.
          required:
          - price
        price_percentage_change_24h:
          type: string
          example: 9.43%
          description: The amount the price of the product has changed, in percent,
            in the last 24 hours.
          required:
          - price_percentage_change_24h
        volume_24h:
          type: string
          example: '1908432'
          description: The trading volume for the product in the last 24 hours.
          required:
          - volume_24h
        volume_percentage_change_24h:
          type: string
          example: 9.43%
          description: The amount the volume of the product has changed, in percent,
            in the last 24 hours.
          required:
          - volume_percentage_change_24h
        base_increment:
          type: string
          example: '0.00000001'
          description: Minimum amount base value can be increased or decreased at
            once.
          required:
          - base_increment
        quote_increment:
          type: string
          example: '0.00000001'
          description: Minimum amount quote value can be increased or decreased at
            once.
          required:
          - quote_increment
        quote_min_size:
          type: string
          example: '0.00000001'
          description: Minimum size that can be represented of quote currency.
          required:
          - quote_min_size
        quote_max_size:
          type: string
          example: '1000'
          description: Maximum size that can be represented of quote currency.
          required:
          - quote_max_size
        base_min_size:
          type: string
          example: '0.00000001'
          description: Minimum size that can be represented of base currency.
          required:
          - base_min_size
        base_max_size:
          type: string
          example: '1000'
          description: Maximum size that can be represented of base currency.
          required:
          - base_max_size
        base_name:
          type: string
          example: Bitcoin
          description: Name of the base currency.
          required:
          - base_name
        quote_name:
          type: string
          example: US Dollar
          description: Name of the quote currency.
          required:
          - quote_name
        watched:
          type: boolean
          example: true
          description: Whether or not the product is on the user's watchlist.
          required:
          - watched
        is_disabled:
          type: boolean
          example: false
          description: Whether or not the product is disabled for trading.
          required:
          - is_disabled
        new:
          type: boolean
          example: true
          description: Whether or not the product is 'new'.
          required:
          - new
        status:
          type: string
          description: Status of the product.
          required:
          - status
        cancel_only:
          type: boolean
          example: true
          description: Whether or not orders of the product can only be cancelled,
            not placed or edited.
          required:
          - cancel_only
        limit_only:
          type: boolean
          example: true
          description: Whether or not orders of the product can only be limit orders,
            not market orders.
          required:
          - limit_only
        post_only:
          type: boolean
          example: true
          description: Whether or not orders of the product can only be posted, not
            cancelled.
          required:
          - post_only
        trading_disabled:
          type: boolean
          example: false
          description: Whether or not the product is disabled for trading for all
            market participants.
          required:
          - trading_disabled
        auction_mode:
          type: boolean
          example: true
          description: Whether or not the product is in auction mode.
          required:
          - auction_mode
        product_type:
          description: Type of the product.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.ProductType'
        quote_currency_id:
          type: string
          example: USD
          description: Symbol of the quote currency.
        base_currency_id:
          type: string
          example: BTC
          description: Symbol of the base currency.
        fcm_trading_session_details:
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.FcmTradingSessionDetails'
        mid_market_price:
          type: string
          example: '140.22'
          description: The current midpoint of the bid-ask spread, in quote currency.
        alias:
          type: string
          example: BTC-USD
          description: Product id for the corresponding unified book.
        alias_to:
          type: array
          example:
          - BTC-USDC
          items:
            type: string
          description: Product ids that this product serves as an alias for.
        base_display_symbol:
          type: string
          example: BTC
          description: Symbol of the base display currency.
          required:
          - base_display_symbol
        quote_display_symbol:
          type: string
          example: USD
          description: Symbol of the quote display currency.
          required:
          - quote_display_symbol
        view_only:
          type: boolean
          example: true
          description: Reflects whether an FCM product has expired. For SPOT, set
            get_tradability_status to get a return value here. Defaulted to false
            for all other product types.
        price_increment:
          type: string
          example: '0.00000001'
          description: Minimum amount price can be increased or decreased at once.
        display_name:
          type: string
          example: BTC PERP
          description: Display name for the product e.g. BTC-PERP-INTX => BTC PERP
        product_venue:
          example: neptune
          description: The sole venue id for the product. Defaults to CBE if the product
            is not specific to a single venue
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.ProductVenue'
        approximate_quote_24h_volume:
          type: string
          example: '1908432'
          description: The approximate trading volume for the product in the last
            24 hours based on the current quote.
        new_at:
          type: string
          format: RFC3339 Timestamp
          example: '2021-07-01T00:00:00Z'
          description: The timestamp when the product was listed. This is only populated
            if product has new tag.
        market_cap:
          type: string
          example: '1500000000000'
          description: The market capitalization of the product's base asset.
        icon_color:
          type: string
          example: red
          description: color for icon display
        icon_url:
          type: string
          example: https://example.com
          description: A URL to the icon image.
        display_name_overwrite:
          type: string
          example: Bitcoin Perpetual
          description: An alternative name to display for the product.
        about_description:
          type: string
          example: nano Crude Oil Futures is a monthly cash-settled contract that
            allows participants to manage risk, trade on margin, or speculate on the
            price of oil.
          description: description used in about section for an asset
        best_bid_price:
          type: string
        best_ask_price:
          type: string
        high_24h:
          type: string
        low_24h:
          type: string
        future_product_details:
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.FutureProductDetails'
        equity_product_details:
          description: Equity-specific identity, trading availability, session, and
            sizing details. Populated when product_type is EQUITY.
          allOf:
          - $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.EquityProductDetails'
      title: Get Products
      required:
      - product_id
      - price
      - volume_24h
      - price_percentage_change_24h
      - volume_percentage_change_24h
      - base_increment
      - quote_increment
      - quote_min_size
      - quote_max_size
      - base_min_size
      - base_max_size
      - base_name
      - quote_name
      - watched
      - is_disabled
      - new
      - status
      - cancel_only
      - limit_only
      - post_only
      - trading_disabled
      - auction_mode
      - base_display_symbol
      - quote_display_symbol
