          type: string
          format: RFC3339 Timestamp
          description: The time when the instrument was first created.
        max_leverage:
          type: string
          description: Maximal leverage for the instrument (futures only).
        max_liquidation_commission:
          type: string
          description: Maximal liquidation trade commission for the instrument (futures
            only).
        tick_size_steps:
          type: array
          items:
