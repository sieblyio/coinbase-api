openapi: 3.1.0
info:
  title: Coinbase Advanced Trade API
  version: '0.1'
paths:
  /api/v3/brokerage/accounts:
    get:
      summary: List Accounts
      description: Get a list of authenticated accounts for the current user.
      operationId: RetailBrokerageApi_GetAccounts
      security:
      - ApiKey:
        - view
      - OAuth2:
        - "wallet:accounts:read"
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.GetAccountsResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.GetAccountsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      parameters:
      - name: limit
        description: The number of accounts to display per page. By default, displays
          49 (max 250). If `has_next` is true, additional pages of accounts are available
          to be fetched. Use the `cursor` parameter to start on a specified page.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: cursor
        description: For paginated responses, returns all responses that come after
          this value.
        in: query
        required: false
        schema:
          type: string
      - name: retail_portfolio_id
        description: '**(Deprecated)** Only returns the accounts matching the portfolio
          ID. Only applicable for legacy keys. CDP keys will default to the key''s
          permissioned portfolio.'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Accounts
  /api/v3/brokerage/accounts/{account_uuid}:
    get:
      summary: Get Account
      description: Get a list of information about an account, given an account UUID.
      operationId: RetailBrokerageApi_GetAccount
      security:
      - ApiKey:
        - view
      - OAuth2:
        - "wallet:accounts:read"
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.GetAccountResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.GetAccountResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      parameters:
      - name: account_uuid
        description: The account's UUID.
        in: path
        required: true
        schema:
          type: string
      tags:
      - Accounts
  /api/v3/brokerage/best_bid_ask:
    get:
      summary: Get Best Bid/Ask
      description: Get the best bid/ask for all products. A subset of all products
        can be returned instead by using the product_ids input.
      operationId: RetailBrokerageApi_GetBestBidAsk
      security:
      - ApiKey:
        - view
      - OAuth2:
        - "wallet:user:read"
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.GetBestBidAskResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.GetBestBidAskResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      parameters:
      - name: product_ids
        description: The list of trading pairs (e.g. 'BTC-USD').
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      tags:
      - Products
  /api/v3/brokerage/product_book:
    get:
      summary: Get Product Book
      description: Get a list of bids/asks for a single product. The amount of detail
        shown can be customized with the limit parameter.
      operationId: RetailBrokerageApi_GetProductBook
      security:
      - ApiKey:
        - view
      - OAuth2:
        - "wallet:user:read"
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.GetProductBookResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.GetProductBookResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      parameters:
      - name: product_id
        description: The trading pair (e.g. 'BTC-USD').
        in: query
        required: true
        schema:
          type: string
      - name: limit
        description: 'The number of bid/asks to be returned. '
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: aggregation_price_increment
        description: The minimum price intervals at which buy and sell orders are
          grouped or combined in the order book.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Products
  /api/v3/brokerage/products:
    get:
      summary: List Products
      description: Get a list of the available currency pairs for trading.
      operationId: RetailBrokerageApi_GetProducts
      security:
      - ApiKey:
        - view
      - OAuth2:
        - "wallet:user:read"
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.Products'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.Products'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      parameters:
      - name: limit
        description: The number of products to be returned.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: offset
        description: The number of products to skip before returning.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: product_type
        description: Only returns products matching this product type. If omitted,
          only SPOT products are returned.
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_PRODUCT_TYPE
          - SPOT
          - FUTURE
          - EQUITY
          - OPTION_GROUP
          - FUTURE_GROUP
          default: UNKNOWN_PRODUCT_TYPE
      - name: product_ids
        description: The list of trading pairs (e.g. 'BTC-USD').
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: contract_expiry_type
        description: Only returns the products matching the contract expiry type.
          Only applicable if product_type is set to FUTURE.
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_CONTRACT_EXPIRY_TYPE
          - EXPIRING
          - PERPETUAL
          default: UNKNOWN_CONTRACT_EXPIRY_TYPE
      - name: expiring_contract_status
        description: Only returns contracts with this status (default is UNEXPIRED).
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_EXPIRING_CONTRACT_STATUS
          - STATUS_UNEXPIRED
          - STATUS_EXPIRED
          - STATUS_ALL
          default: UNKNOWN_EXPIRING_CONTRACT_STATUS
      - name: get_tradability_status
        description: Whether or not to populate view_only with the tradability status
          of the product. This is only enabled for SPOT products.
        in: query
        required: false
        schema:
          type: boolean
      - name: get_all_products
        description: If true, return all products of all product types (including
          expired futures contracts).
        in: query
        required: false
        schema:
          type: boolean
      - name: products_sort_order
        description: The order in which products are returned. By default, products
          are returned in 24 hour volume descending (in quote).
        in: query
        required: false
        schema:
          type: string
          enum:
          - PRODUCTS_SORT_ORDER_UNDEFINED
          - PRODUCTS_SORT_ORDER_VOLUME_24H_DESCENDING
          - PRODUCTS_SORT_ORDER_LIST_TIME_DESCENDING
          default: PRODUCTS_SORT_ORDER_UNDEFINED
      - name: cursor
        description: The cursor to use for pagination. This will be a base64 encoded
          string that decodes into the last productId of the previously returned page
        in: query
        required: false
        schema:
          type: string
      - name: futures_underlying_type
        description: Only returns the products matching the underlying type. Only
          applicable if product_type is set to FUTURE.
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_FUTURES_UNDERLYING_TYPE
          - FUTURES_UNDERLYING_TYPE_SPOT
          - FUTURES_UNDERLYING_TYPE_INDEX
          - FUTURES_UNDERLYING_TYPE_EQUITY
          - FUTURES_UNDERLYING_TYPE_EQUITY_INDEX
          - FUTURES_UNDERLYING_TYPE_EQUITY_ETF
          - FUTURES_UNDERLYING_TYPE_PREIPO
          - FUTURES_UNDERLYING_TYPE_COMMOD
          - FUTURES_UNDERLYING_TYPE_COMMOD_ETF
          - FUTURES_UNDERLYING_TYPE_COMMOD_INDEX
          - FUTURES_UNDERLYING_TYPE_ADR
          - FUTURES_UNDERLYING_TYPE_FOREIGN_EQUITY
          - FUTURES_UNDERLYING_TYPE_OTC
          default: UNKNOWN_FUTURES_UNDERLYING_TYPE
      - name: user_country_code
        description: The country code of the user. This is used to provide differentiated
          product display names.
        in: query
        required: false
        schema:
          type: string
      - name: expired
        description: If true, return recently expired instruments instead of active
          ones. Only applicable to product_venue=DERIBIT; ignored for other venues.
          Defaults to false.
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Products
  /api/v3/brokerage/products/{product_id}:
    get:
      summary: Get Product
      description: 'Get information on a single product by product ID.


        **Equities:** Use the canonical `product_id` returned by the Products API,
        not the display ticker. Equity responses include `equity_product_details`,
        which describes the security, current trading session, order-size permissions,
        and halt or liquidate-only state.'
      operationId: RetailBrokerageApi_GetProduct
      security:
      - ApiKey:
        - view
      - OAuth2:
        - "wallet:user:read"
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.Product'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.Product'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      parameters:
      - name: product_id
        description: The trading pair (e.g. 'BTC-USD').
        in: path
        required: true
        schema:
          type: string
      - name: get_tradability_status
        description: Whether or not to populate view_only with the tradability status
          of the product. This is only enabled for SPOT products.
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Products
  /api/v3/brokerage/products/{product_id}/candles:
    get:
      summary: Get Product Candles
      description: Get rates for a single product by product ID, grouped in buckets.
      operationId: RetailBrokerageApi_GetCandles
      security:
      - ApiKey:
        - view
      - OAuth2:
        - "wallet:user:read"
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.Candles'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.Candles'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      parameters:
      - name: product_id
        description: The trading pair (e.g. 'BTC-USD').
        in: path
        required: true
        schema:
          type: string
      - name: start
        description: The UNIX timestamp indicating the start of the time interval.
        in: query
        required: true
        schema:
          type: string
      - name: end
        description: The UNIX timestamp indicating the end of the time interval.
        in: query
        required: true
        schema:
          type: string
      - name: granularity
        description: The timeframe each candle represents.
        in: query
        required: true
        schema:
          type: string
          enum:
          - UNKNOWN_GRANULARITY
          - ONE_MINUTE
          - FIVE_MINUTE
          - FIFTEEN_MINUTE
          - THIRTY_MINUTE
          - ONE_HOUR
          - TWO_HOUR
          - FOUR_HOUR
          - SIX_HOUR
          - ONE_DAY
          default: UNKNOWN_GRANULARITY
      - name: limit
        description: The number of candle buckets to be returned. By default, returns
          350 (max 350).
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - Products
  /api/v3/brokerage/products/{product_id}/ticker:
    get:
      summary: Get Market Trades
      description: Get snapshot information by product ID about the last trades (ticks)
        and best bid/ask.
      operationId: RetailBrokerageApi_GetMarketTrades
      security:
      - ApiKey:
        - view
      - OAuth2:
        - "wallet:user:read"
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.GetMarketTradesResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.GetMarketTradesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      parameters:
      - name: product_id
        description: The trading pair (e.g. 'BTC-USD').
        in: path
        required: true
        schema:
          type: string
      - name: limit
        description: 'The number of trades to be returned. '
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: start
        description: The UNIX timestamp indicating the start of the time interval.
        in: query
        required: false
        schema:
          type: string
      - name: end
        description: The UNIX timestamp indicating the end of the time interval.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Products
  /api/v3/brokerage/orders:
    post:
      summary: Create Order
      description: 'Create an order with a specified `product_id`, `side`, and `order_configuration`.


        **Equities:** Use the canonical `product_id` returned by the Products API,
        not the display ticker. Include `equity_order_metadata` to select the trading
        session and time in force. Use `market_market_ioc` with `MARKET_GFD` for market
        orders, which are supported only during the normal session. Use `limit_limit_gtc`
        with `LIMIT_GFD` or `LIMIT_GTC` for limit orders. In pre-market, after-hours,
        overnight, or multi-session trading, specify a positive whole-share `base_size`;
        `quote_size` and fractional sizing are not supported. Attached orders are
        not supported for equities.'
      operationId: RetailBrokerageApi_PostOrder
      security:
      - ApiKey:
        - trade
      - OAuth2:
        - "wallet:buys:create"
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.NewOrderResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.NewOrderResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.NewOrderRequest'
        required: true
      tags:
      - Orders
  /api/v3/brokerage/orders/batch_cancel:
    post:
      summary: Cancel Orders
      description: 'Initiate cancel requests for one or more orders.


        **Equities:** Equity orders use the same `order_ids` request and per-order
        result format as other products. Do not include `equity_order_metadata` when
        canceling an order.'
      operationId: RetailBrokerageApi_CancelOrders
      security:
      - ApiKey:
        - trade
      - OAuth2:
        - "wallet:buys:create"
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.CancelOrdersResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.CancelOrdersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.CancelOrdersRequest'
        required: true
      tags:
      - Orders
  /api/v3/brokerage/orders/edit:
    post:
      summary: Edit Order
      description: Edit an order with a specified new `size`, or new `price`.
      operationId: RetailBrokerageApi_EditOrder
      security:
      - ApiKey:
        - trade
      - OAuth2:
        - "wallet:buys:create"
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.EditOrderResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.EditOrderResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      requestBody:
        $ref: '#/components/requestBodies/coinbase.public_api.authed.retail_brokerage_api.EditOrderRequest'
      tags:
      - Orders
  /api/v3/brokerage/orders/edit_preview:
    post:
      summary: Edit Order Preview
      description: Preview an edit order request with a specified new `size`, or new
        `price`.
      operationId: RetailBrokerageApi_PreviewEditOrder
      security:
      - ApiKey:
        - view
      - OAuth2:
        - "wallet:buys:create"
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.PreviewEditOrderResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.PreviewEditOrderResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      requestBody:
        $ref: '#/components/requestBodies/coinbase.public_api.authed.retail_brokerage_api.EditOrderRequest'
      tags:
      - Orders
  /api/v3/brokerage/orders/historical/batch:
    get:
      summary: List Orders
      description: 'Get a list of orders filtered by optional query parameters (`product_ids`,
        `order_status`, etc.).


        **Equities:** Set `product_type` to `EQUITY` to return only equity orders.
        Each equity order includes its time in force in `displayed_order_config` and
        execution session in `equity_trading_session`.'
      operationId: RetailBrokerageApi_GetHistoricalOrders
      security:
      - ApiKey:
        - view
      - OAuth2:
        - "wallet:transactions:read"
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.GetHistoricalOrdersResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/coinbase.public_api.authed.retail_brokerage_api.GetHistoricalOrdersResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/grpc.gateway.runtime.Error'
      parameters:
      - name: order_ids
        description: ID(s) of order(s).
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: product_ids
        description: Optional canonical product ID(s) to filter by. For equities,
          use product_id rather than the display ticker. If omitted, orders for all
          products are returned.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: product_type
        description: Returns orders matching this product type. Use EQUITY for equity
          orders. By default, returns all product types.
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_PRODUCT_TYPE
          - SPOT
          - FUTURE
          - EQUITY
          - OPTION_GROUP
          - FUTURE_GROUP
          default: UNKNOWN_PRODUCT_TYPE
      - name: order_status
        description: Only returns orders matching the specified order statuses.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - PENDING
            - OPEN
            - FILLED
            - CANCELLED
            - EXPIRED
            - FAILED
            - UNKNOWN_ORDER_STATUS
            - QUEUED
            - CANCEL_QUEUED
            - EDIT_QUEUED
      - name: time_in_forces
        description: Only orders matching this time in force(s) are returned. Default
          is to return all time in forces.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - UNKNOWN_TIME_IN_FORCE
            - GOOD_UNTIL_DATE_TIME
            - GOOD_UNTIL_CANCELLED
            - IMMEDIATE_OR_CANCEL
            - FILL_OR_KILL
      - name: order_types
        description: Only returns orders matching the specified order types (e.g.
          MARKET). By default, returns all order types.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - UNKNOWN_ORDER_TYPE
            - MARKET
            - LIMIT
            - STOP
            - STOP_LIMIT
            - BRACKET
            - TWAP
            - ROLL_OPEN
            - ROLL_CLOSE
            - LIQUIDATION
            - SCALED
      - name: order_side
        description: Only returns the orders matching the specified side (e.g. 'BUY',
          'SELL'). By default, returns all sides.
        in: query
        required: false
        schema:
          type: string
          enum:
          - BUY
          - SELL
          default: ''
      - name: start_date
        description: The start date to fetch orders from (inclusive). If provided,
          only orders created after this date will be returned.
        in: query
        required: false
        schema:
          type: string
          format: RFC3339 Timestamp
      - name: end_date
        description: The end date to fetch orders from (exclusive). If provided, only
          orders with creation time before this date will be returned.
        in: query
        required: false
        schema:
          type: string
          format: RFC3339 Timestamp
      - name: order_placement_source
        description: Only returns the orders matching this placement source. By default,
          returns RETAIL_ADVANCED placement source.
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_PLACEMENT_SOURCE
          - RETAIL_SIMPLE
          - RETAIL_ADVANCED
          - RETAIL_ADMIN
          - RETAIL_RAISE
          default: RETAIL_ADVANCED
      - name: contract_expiry_type
        description: Only returns the orders matching the contract expiry type. Only
          applicable if product_type is set to FUTURE.
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_CONTRACT_EXPIRY_TYPE
          - EXPIRING
          - PERPETUAL
          default: UNKNOWN_CONTRACT_EXPIRY_TYPE
      - name: asset_filters
        description: Only returns the orders where the quote, base or underlying asset
          matches the provided asset filter(s) (e.g. 'BTC').
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: retail_portfolio_id
        description: '**(Deprecated)** Only orders matching this retail portfolio
          id are returned. Only applicable for legacy keys. CDP keys will default
          to the key''s permissioned portfolio.'
        in: query
        required: false
        schema:
          type: string
      - name: limit
        description: The number of orders to display per page (no default amount).
          If `has_next` is true, additional pages of orders are available to be fetched.
          Use the `cursor` parameter to start on a specified page.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: cursor
        description: For paginated responses, returns all responses that come after
          this value.
        in: query
        required: false
        schema:
          type: string
      - name: sort_by
        description: Sort results by a field, results use unstable pagination. Default
          is to sort by creation time.
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNKNOWN_SORT_BY
          - LIMIT_PRICE
          - LAST_FILL_TIME
          - LAST_UPDATE_TIME
          default: UNKNOWN_SORT_BY
      - name: user_native_currency
        description: '**(Deprecated)**  Native currency to fetch order with. Default
          is `USD`.'
        in: query
        required: false
        schema:
          type: string
      - name: use_simplified_total_value_calculation
        description: Optional boolean to use simplified total value calculation. Default
          is true.
        in: query
        required: false
        schema:
          type: boolean
          default: 'true'
      - name: proof_token
        description: Optional proof token for 2FA validation when accessing transaction
          history (EU SCA compliance).
        in: query
        required: false
        schema:
          type: string
      tags:
      - Orders
