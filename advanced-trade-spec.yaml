          type: string
          title: 'The beneficiary bank id code is a standard identifier which tells
            us what the beneficiary bank id value represents.

            B - SWIFT Bank Identifier Code (BIC)

            C - CHIPS Participant

            D - Demand Deposit Account (DDA) Number

            F - Fed Routing Number

            T - SWIFT BIC or Bank Entity Identifier (BEI) and Account Number

            U - CHIPS Identifier'
